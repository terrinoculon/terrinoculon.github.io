- title: "Semantic Segmentation for Surface Anomalies and Defects Detection"
  meta: "2024 – Present . Artmyn"
  media:
    type: "video"
    poster: "assets/images/segmentation.png"
    src: "assets/videos/segmentation_optimized.mp4"
    caption: "Condition analysis results."
  description: |-
    Surface defects and anomalies are rare by nature — their label distribution is severely skewed even within an already sparse dataset, making this a fundamental data scarcity problem compounded by class imbalance rather than a standard segmentation task. The input is a 16-channel multimodal signal produced by Artmyn's gigapixel digital twin capture pipeline, where each modality has distinct statistical properties requiring independent normalisation and augmentation strategies. Geometric augmentations on surface normals, for instance, require component-wise sign corrections to remain physically consistent.
    
    Annotation was developed with domain experts and is sparse, partially covering each asset, with labels ranging from precise to weak and positive-only depending on defect visibility. To build a reliable training signal from this, we progressed deliberately through increasingly sophisticated learning regimes: standard supervision established a baseline, pseudo-labelling extended it to unlabelled data, and a Mean Teacher and FixMatch hybrid addressed the confirmation bias that naive pseudo-labelling introduced at scale. Rare class supervision was further reinforced through distribution-aware resampling, selective loss masking over annotated regions, and a combination of focal, dice, and BCE losses weighted by class frequency.
    
    The training infrastructure was built from scratch to support this progression. As data volume scaled toward SSL, augmentation and I/O became sequential bottlenecks — resolved through a migration from Kornia to DALI for GPU-accelerated augmentation and WebDataset-based streaming, making the pipeline genuinely compute-bound. A zoo of UNet++, SegFormer, and DeepLabV3 models was trained under this regime and ensembled at inference.
    
    Inference on gigapixel assets introduces a separate class of problems. Patch-level prediction consistency across an asset is non-trivial — intra-asset distribution shift from material variation and illumination drift means naive sliding window produces spatially inconsistent results. Quantile-based normalisation per patch reduced but did not eliminate confidence variation across the asset. Test-time augmentation and model ensemble via majority voting were the primary mechanisms for achieving consistent predictions at scale without sacrificing precision or recall on rare defect classes.

- title: "Differentiable Rendering for Spatially-Varying Reflectance Estimation"
  meta: "2022 – 2024 . Artmyn"
  media:
    type: "video"
    poster: "assets/images/svbrdf.png"
    src: "assets/videos/svbrdf_optimized.mp4"
    caption: "Specular reflectance example."
  description: |-
    An aspect of real world objects that is often ignored in 3D-reconstructions is reflectance capture. The visual richness of material textures in real world arises from the way light interacts with the surface roughness of the object, resulting in cues we perceive such as matte, glossy, shiny. To effectively estimate this reflectance, I built a differentiable renderer for inverse rendering, partially inspired by the idea behind NeRF. The resulting reflectance model brought drastic realism improvements with an increase of up to 15dB of PSNR in objects with regions of specular highlights.

- title: "Gigapixel-Scale Multi-Modal Capture and Processing Pipeline"
  meta: "2021 – 2023 . Artmyn"
  media:
    type: "video"
    poster: "assets/images/pipeline.png"
    src: "assets/videos/pipeline_optimized.mp4"
    caption: "Gigapixel scale multimodal model."
  description: |-
    Artmyn's multimodal imaging pipeline operates at 2000ppi, producing gigapixel assets. This comes with several challenges. Consistent image registration is a big challenge, particularly across regions with repeating patterns, which can occur surprisingly often in paintings. To overcome this, I built CRAFT, an inhouse adaptation of the RAFT optical flow CNN, where we added a real geometry encoder based on estimated depth and transfer learnt on synthetic data, resulting in a reduction of failure rates from 20% to under 1%. Accurate depth estimation at these scales is also non-trivial. I cast the problem as a large scale inverse problem with priors from both photometric cues and stereo displacement to improve depth estimation drastically. I also contributed heavily to proper camera sensor and color calibration models resulting in extremely high fidelity digital twins.

- title: "3D Reconstruction in the Wild"
  meta: "2024 . CS231N"
  media:
    type: "image"
    src: "assets/images/recons.png"
    alt: "3D reconstruction result"
    caption: "3D reconstruction in the wild."
  description: |-
    This was a research project for the course CS231N - Deep Learning for Computer Vision at Stanford Online. In this project the problem of Phototourism - i.e recreating a 3D model of the real world from unstructured set of photographs is considered from a deep learning perspective. The work explores the use of deep learning components in the classical structure from motion pipeline. It also explores the replacement of the optimization component bundle adjustment using the recently proposed DBARF, a generalized NERF inspired neural rendering method that simultaneously optimizes camera pose and image rendering. It is seen that while deep-learning components are in general successful in improving the feature description and matching stage, even neural rendering methods that _optimize_ instead of learn, fail to achieve the accuracy of bundle adjustment.
  links:
    - label: "Report"
      href: "assets/docs/3D_Reconstruction_in_the_Wild.pdf"
    - label: "Code"
      href: "https://github.com/tniranjan/recons3d"

- title: "Exploring the capability of Tiny Language Models for story telling for resource constrained languages"
  meta: "2025 . CS224N"
  media:
    type: "image"
    src: "assets/images/tlm.png"
    alt: "Evaluation of TLMs"
  description: |-
    This was a research project for the course CS224N - Natural Language Processing at Stanford Online. In this study, we are interested in Tamil language models that can tell stories with the same complexity as told to toddlers and young children. To build such a model we created a machine translated version of the TinyStories dataset with 1M stories in the train split. We then explore GPTNeo and Llama models of differing sizes, all less than 150M parameters to learn story telling. We take a three stage approach, where the model is first pretrained on internet quality Tamil data. Next the machine translated dataset is used for continual training. Followed by this we run a final fine tuning run with a very small expert curated dataset of 2000 stories in the train split. We also attempt LoRA fine tuning of an English language GPTNeo model. We see that while the models are able to tell stories, they are not of high quality, mainly arising from the low-quality of machine translations. Some of the resulting models are small enough at less than 100MB and can easily run on your browser. Head over to the project site to give it a try.
  links:
    - label: "Report"
      href: "assets/docs/CS224N__Project_Final_Report-5.pdf"
    - label: "Project Page"
      href: "https://tniranjan.github.io/kurunkathai"
    - label: "Code"
      href: "https://github.com/tniranjan/kurunkathai"

- title: "Computational Methods for freeform optics design"
  meta: "2017 - 2020 . Rayform"  
  description: |-
    At Rayform, I contributed heavily to the algorithm in production for the design of freeform optics. My particular focus was on the computational method behind the lens' surface design, resulting in a parameter-free algorithm that was robust to more general light configurations. This has since been licensed to LVMH's Fred brand.
  links:
    - label: "Rayform"
      href: "https://www.rayform.ch/"

